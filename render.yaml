services:
  - type: web
    name: ai-investment-advisor
    runtime: python
    plan: starter
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: bash scripts/start_render.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: TZ
        value: America/Sao_Paulo
      - key: DATA_DIR
        value: /var/data
    healthCheckPath: /health
    disk:
      name: advisor-data
      mountPath: /var/data
      sizeGB: 10

